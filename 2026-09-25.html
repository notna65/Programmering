<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="http://koda.nu/simple.js">



var player = { x: 100, y: 300, size: 20, color: "blue", speed: 4 };

//var zombie1 = { x: 300, y: 220 };
var zombie1 = { x: 300, y: 220, speed: 2 };
var zombie2 = { x: 100, y: 400, speed: 2 };
var zombie3 = { x: 700, y: 260, speed: 2 };
var zombie4 = { x: 700, y: 460, speed: 2 };

function drawZombie(x, y) {
  rectangle(x + 3, y - 10, 23, 65, "lightgreen");
  rectangle(x + 3, y - 25, 23, 65, "gray");
  circle(x + 15, y - 40, 20, "lightgreen");
  circle(x, y - 40, 3, "red");
  rectangle(x - 35, y - 20, 30, 14, "lightgreen");
  rectangle(x - 20, y - 20, 30, 14, "gray");
}      //zombien som också kan spawnas färdig med drawZombie

function update() {
  clearScreen();
  text(20, 30, 24, "Zombiespelet", "black");

  drawZombie(zombie1.x, zombie1.y); //drawZombie skapar en färdig zombie istället för att behöva bygga en ny från scratch
  drawZombie(zombie2.x, zombie2.y);
  drawZombie(zombie3.x, zombie3.y);
  drawZombie(zombie4.x, zombie4.y);

  circle(player.x, player.y, player.size, player.color);

  if (keyboard.d) {
    player.x = player.x + player.speed;
  }
  if (keyboard.a) {
    player.x = player.x - player.speed;
  }
  if (keyboard.w) {
    player.y = player.y - player.speed;
  }
  if (keyboard.s) {
    player.y = player.y + player.speed;
  }

  // STEG 2: zombie1 jagar dig här

  if (distance(player, zombie1) < 65) {
    text(20, 70, 30, "AJ!", "red")
    //window.location.reload()
  }
  if(distance(player, zombie2) < 65) {
    text(20, 70, 30, "AJ", "red")
    //window.location.reload()
  }
  if(distance(player, zombie3) < 65) {
    text(20, 70, 30, "AJ", "red")
    //window.location.reload()
  }
  if(distance(player, zombie4) < 65) {
    text(20, 70, 30, "AJ", "red")
    //window.location.reload()
  }



  if(zombie1.x < player.x) {
    zombie1.x = zombie1.x + zombie1.speed; //Gör så att zombie1 jagar dig i alla vinklar. För att få resten av zombierna att jaga dig så kopier alla if(zombie1)
  }
  if(zombie1.x > player.x) {               //satser och byt ut till 2,3,4
    zombie1.x = zombie1.x - zombie1.speed;
  }
  if(zombie1.y < player.y) {
    zombie1.y = zombie1.y + zombie1.speed;
  }
  if(zombie1.y > player.y) {
    zombie1.y = zombie1.y - zombie1.speed;
  }


if(zombie2.x < player.x) {
  zombie2.x = zombie2.x + zombie2.speed;
}
if(zombie2.x > player.x) {               
  zombie2.x = zombie2.x - zombie2.speed;
}
if(zombie2.y < player.y) {
  zombie2.y = zombie2.y + zombie2.speed;
}
if(zombie2.y > player.y) {
  zombie2.y = zombie2.y - zombie2.speed;
}


if(zombie3.x < player.x) {
  zombie3.x = zombie3.x + zombie3.speed;
}
if(zombie3.x > player.x) {               
  zombie3.x = zombie3.x - zombie3.speed;
}
if(zombie3.y < player.y) {
  zombie3.y = zombie3.y + zombie3.speed;
}
if(zombie3.y > player.y) {
  zombie3.y = zombie3.y - zombie3.speed;
} 


if(zombie4.x < player.x) {
  zombie4.x = zombie4.x + zombie4.speed;
}
if(zombie4.x > player.x) {               
  zombie4.x = zombie4.x - zombie4.speed;
}
if(zombie4.y < player.y) {
  zombie4.y = zombie4.y + zombie4.speed;
}
if(zombie4.y > player.y) {
  zombie4.y = zombie4.y - zombie4.speed;
}

  }

























    </script>
    </body>
</html>
