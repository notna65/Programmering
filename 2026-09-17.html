<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="http://koda.nu/simple.js">

    var player = { x: 400, y: 300, size: 40, color: "blue", speed: 4}; 
    var x = 500;
    var y = 200;
    var storlek = 50;

    function update() {
        clearScreen();
        circle(player.x, player.y, player.size, player.color,);
        text(40, 50, 40, "x är: " + player.x + " | y är: " + player.y)
        circle(x, y, storlek, "black")

        if(keyboard.d) {
            player.x = player.x + player.speed;
        }
        if(keyboard.a) {
            player.x = player.x - player.speed;
        }
        if(keyboard.s) {
            player.y = player.y + player.speed;
        }
        if(keyboard.w) {
            player.y = player.y - player.speed;
        }
        if(player.x + player.size > totalWidth) {
            player.x = totalWidth - player.size; //Stannar på höger kant
        }
        if(player.y + player.size > totalHeight) {
            player.y = totalHeight - player.size; //Stannar på den nedre kanten
        }
        if(player.x - player.size < 0) {
            player.x = 0 + player.size; //Stannar på vänster kant
        }
        if(player.y - player.size < 0) {
            player.y = 0 + player.size; //Stannar längst upp
        }
        if(keyboard.space) {
            player.speed = player.speed * 2 //Dashar när man klickar på space
        } else {
                player.speed = 5
            
        }
        if(keyboard.space) {
            player.color = mixColor(random(256), random(256), random(256))
        }

        if(player.x + player.size * 2 > x) {
            text(50, 100, 40, "Krock!")
            if(player.y - player.size * 2 < y) {  //När bollen åker nära den svarta bollen så dyker det upp en text "Krock!""
                
            }
        }
    }
























    </script>
</body>
</html>
