function drawZombie(x, y) {
  save();
  translate(x, y);
  rectangle(3, -10, 23, 65, "lightgreen");
  rectangle(3, -25, 23, 65, "gray");
  circle(15, -40, 20, "lightgreen");
  circle(0, -40, 3, "red");
  rectangle(-35, -20, 30, 14, "lightgreen");
  rectangle(-20, -20, 30, 14, "gray");
  restore();
}

function update() {
  clearScreen();
  text(20, 30, 24, "Zombiespelet", "black");

  drawZombie(zombie1.x, zombie1.y);
  drawZombie(zombie2.x, zombie2.y);
  drawZombie(zombie3.x, zombie3.y);

  circle(player.x, player.y, player.size, player.color);

  if (keyboard.d) {
    player.x = player.x + player.speed;
  }
  if (keyboard.a) {
    player.x = player.x - player.speed;
  }
  if (keyboard.w) {
    player.y = player.y - player.speed;
  }
  if (keyboard.s) {
    player.y = player.y + player.speed;
  }


//Jag byter ofta tangenter för att player ska flytta på sig, till wasd och inte piltangenter.

  if (distance(player, zombie1) < 65) {

  } else {
