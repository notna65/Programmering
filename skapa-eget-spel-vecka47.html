    <script src="http://koda.nu/simple.js">


 var player = {x: 95, y: 50, size:20, color:"red", speed:4}; //Variabeln för spelaren/bollen. 
 
 var wallHitImage = "scarymazegame.jpg"
 //Bilden som poppar upp när man dör ^^
 function touchesBlueWall(x, y) {
    return getPixel(x + player.size, y).blue > 250||
    getPixel(x - player.size, y).blue > 250||
    getPixel(x, y + player.size).blue > 250||
    getPixel(x, y - player.size).blue > 250;
 }

//Deras position och hastighet. 
var zombie1 = { x: 300, y: 220, speed: 1 };
var zombie2 = { x: 500, y: 400, speed: 1 };

//Funktionen för att rita ut zombies
function drawZombie(x, y) {
  save();
  translate(x, y);
  //rectangle(3, -10, 23, 65, "gray");
  rectangle(8, -29, 15, 35, "gray"); //ben
  circle(15, -40, 17, "gray"); //huvud
  circle(4, -41, 3, "#a200dd"); //ögon
  //rectangle(-35, -20, 30, 14, "gray");
  rectangle(-11, -20, 22, 9, "gray"); //armar
  restore();
}


 

function update() {
    clearScreen()

  
  rectangle(0, 0, totalWidth, totalHeight, "black") //Bakgrunden 


  //Allt nedanför är för labyrinten. 
  rectangle(125, 90, 775, 12, "blue"); //vänster uppe
  rectangle(900, 90, 925, 12, "blue");
  rectangle(55, 90, 12, 720, "blue");
  rectangle(1813, 90, 12, 720, "blue");

  rectangle(1750, 798, 75, 12, "blue");

  rectangle(300, 102, 12, 78, "blue");
  rectangle(420, 192, 12, 128, "blue");
  rectangle(740, 102, 12, 78, "blue");
  //rectangle(870, 192, 12, 128, "blue");

  rectangle(67, 320, 143, 12, "blue");

  rectangle(210, 192, 12, 128, "blue");

  rectangle(1400, 332, 12, 168, "blue");

  rectangle(210, 500, 270, 12, "blue");
  rectangle(600, 500, 300, 12, "blue");
  rectangle(1020, 500, 260, 12, "blue");
  rectangle(1400, 500, 250, 12, "blue");

  rectangle(480, 382, 12, 130, "blue");
  rectangle(888, 512, 12, 90, "blue");
  rectangle(1280, 332, 12, 168, "blue");
  rectangle(1712, 149, 12, 595, "blue");

  rectangle(124, 650, 333, 12, "blue");
  rectangle(420, 650, 480, 12, "blue");
  rectangle(970, 650, 270, 12, "blue");
  rectangle(1300, 650, 280, 12, "blue");

  //rectangle(300, 512, 12, 138, "blue");
  rectangle(420, 662, 12, 80, "blue");
  rectangle(1200, 512, 12, 138, "blue");
  rectangle(1300, 662, 12, 93, "blue");

  //Funktionen drawZombie används för att rita ut zombies på angivna kordinater. 
  drawZombie(zombie1.x, zombie1.y);
  drawZombie(zombie2.x, zombie2.y);


var nextX = player.x
var nextY = player.y



if(keyboard.d) {
    nextX = player.x + player.speed;
}
if(keyboard.a) {
    nextX = player.x - player.speed;
}
if(keyboard.w){
    nextY = player.y - player.speed
}
if(keyboard.s){
    nextY = player.y + player.speed;
}

if(distance(player, zombie1) < 40) {
    text(280, 250, 50, "You were slain...", "red");
    stopUpdate();
}

if (zombie1.x < player.x) {
    zombie1.x = zombie1.x + zombie1.speed;
  }
  if (zombie1.x > player.x) {
    zombie1.x = zombie1.x - zombie1.speed;
  }
  if (zombie1.y < player.y) {
    zombie1.y = zombie1.y + zombie1.speed;
  }
  if (zombie1.y > player.y) {
    zombie1.y = zombie1.y - zombie1.speed;
  }

  if(distance(player, zombie1) < 40) {
    text(280, 250, 50, "You were slain...", "red");
    stopUpdate();
  }

    if (zombie2.x < player.x) {
    zombie2.x = zombie2.x + zombie2.speed;
  }
  if (zombie2.x > player.x) {
    zombie2.x = zombie2.x - zombie2.speed;
  }
  if (zombie2.y < player.y) {
    zombie2.y = zombie2.y + zombie2.speed;
  }
  if (zombie2.y > player.y) {
    zombie2.y = zombie2.y - zombie2.speed;
  }




//om spelarna rör vi färgen blåså dyker kattbilden upp, annars så fortsätter spelet. 
if(touchesBlueWall(nextX, player.y)){
    picture(0, 0, wallHitImage, totalWidth, totalHeight);
    stopUpdate();
    return;
}   else{
    player.x = nextX
}

if(touchesBlueWall(player.x, nextY)){
    picture(0, 0, wallHitImage, totalWidth, totalHeight);
    stopUpdate();
    return;
}else{
    player.y = nextY
}

    stopUpdate();
}*/




circle(player.x, player.y, player.size, player.color);













}
